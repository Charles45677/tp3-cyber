services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.be
    container_name: ctf_backend
    expose:
      - "5000"
    networks:
      - ctf_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.fe
    container_name: ctf_frontend
    ports:
      - "15556:15556"
    depends_on:
      - backend
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge
